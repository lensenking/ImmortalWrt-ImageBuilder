#==============================================================================
# N100 · ImmortalWrt 25.12 源码编译 (配齐 kucat/mosdns/turboacc + 全代理)
# 手动触发; 约 1-2 小时。产物: x86_64 EFI 固件 .img.gz
#==============================================================================
name: build-source-n100

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: n100-src/n100.config
  DIY_SH: n100-src/diy.sh
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出 fork (取 diy/config/files)
        uses: actions/checkout@v4

      - name: 释放磁盘 + 安装依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 ImmortalWrt 源码 (${{ env.REPO_BRANCH }})
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --depth 1 openwrt

      - name: 运行 diy (加 feed + kucat) 并更新安装 feeds
        run: |
          chmod +x $DIY_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入 config + files 并 defconfig
        run: |
          [ -d n100-src/files ] && cp -r n100-src/files openwrt/files
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          echo "===== 实际选中的关键插件 ====="
          grep -E "openclash|passwall|clashoo|daed|mosdns|turboacc|kucat|netdata|mwan3|dockerman" .config | grep "=y" || true

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -delete 2>/dev/null || true

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "用 $(nproc) 线程编译"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "BUILD_DATE=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          echo "FW=$PWD/bin/targets/x86/64" >> $GITHUB_ENV

      - name: 整理产物
        run: |
          cd $FW
          rm -rf packages *.buildinfo *.manifest sha256sums profiles.json 2>/dev/null || true
          ls -lh

      - name: 上传到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N100-source-25.12-${{ env.BUILD_DATE }}
          path: ${{ env.FW }}/*

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N100-source-25.12
          name: N100 ImmortalWrt 25.12 源码版 (${{ env.BUILD_DATE }})
          files: ${{ env.FW }}/*
          body: |
            ImmortalWrt 25.12 · x86_64 · 源码编译版 (配齐 kucat/mosdns/turboacc)
            代理: openclash/passwall/clashoo/dae (默认不启用, 只开一个; 无 nikki: 与 clashoo 互斥)
            UEFI 用 *generic-squashfs-combined-efi.img.gz*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
